{% extends "base.html" %}
{% block body %}
<div class="card" style="max-width:360px;margin:60px auto">
  <h2>Staff login</h2>
  {% if error %}<p style="color:var(--bad)">{{ error }}</p>{% endif %}
  <form method="post" action="/admin/login">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <p><input name="username" placeholder="Username" autocomplete="username" required style="width:100%"></p>
    <p><input name="password" type="password" placeholder="Password" autocomplete="current-password" required style="width:100%"></p>
    <button class="primary" style="width:100%">Log in</button>
  </form>
  {% if env == 'dev' %}<p class="muted">Dev default: admin / admin</p>{% endif %}
</div>
{% endblock %}
