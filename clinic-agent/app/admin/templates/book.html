{% extends "base.html" %}
{% block body %}
<div class="card">
  <h2>Manual booking (phone / desk)</h2>
  <form method="get"><input type="date" name="day" value="{{ day }}"> <button>Show free slots</button></form>
  <form method="post" action="/admin/book" style="margin-top:12px">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <p><input name="phone" placeholder="+91XXXXXXXXXX" required> <input name="name" placeholder="Patient name" required></p>
    <p><select name="start" required>{% for s in slots %}<option value="{{ s.iso }}">{{ s.label }}</option>{% endfor %}</select>
    {% if not slots %}<span class="muted">No free slots that day.</span>{% endif %}</p>
    <button class="primary">Book</button>
  </form>
  <p class="muted">Walk-ins without an appointment: use "Add walk-in" on the queue board.</p>
</div>
{% endblock %}
