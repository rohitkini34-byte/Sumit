{% extends "base.html" %}
{% block body %}
<div class="card" style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
  <form method="get" class="inline"><input type="date" name="day" value="{{ day }}">
  <select name="session">{% for s in sessions %}<option {% if s == session %}selected{% endif %}>{{ s }}</option>{% endfor %}</select>
  <button>Go</button></form>
  <span class="muted">TV display: open /queue/display/&lt;QUEUE_DISPLAY_KEY&gt; on the waiting-room screen.</span>
</div>
<div id="board" hx-get="/admin/queue/board?day={{ day }}&session={{ session }}" hx-trigger="every 10s" hx-swap="innerHTML" hx-headers='{"X-CSRF-Token": "{{ csrf }}"}'>
{% include "_queue_board.html" %}
</div>
{% endblock %}
