name: clinic-agent

on:
  push:
    paths: ["clinic-agent/**", ".github/workflows/clinic-agent.yml"]
  pull_request:
    paths: ["clinic-agent/**", ".github/workflows/clinic-agent.yml"]

defaults:
  run:
    working-directory: clinic-agent

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: clinic_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Tests (SQLite)
        run: pytest -q --cov=app.calendar --cov=app.scheduling --cov=app.agent.router --cov-fail-under=85
      - name: Tests (Postgres)
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/clinic_test
        run: pytest -q
      - name: Migrations are in sync with the models
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/clinic_test
        run: |
          psql postgresql://postgres:postgres@localhost:5432/postgres -c "DROP DATABASE IF EXISTS mig" -c "CREATE DATABASE mig"
          DATABASE_URL=postgresql+asyncpg://postgres:postgres@localhost:5432/mig alembic upgrade head
          DATABASE_URL=postgresql+asyncpg://postgres:postgres@localhost:5432/mig alembic check
      - name: pip-audit
        run: pip-audit --strict --skip-editable
