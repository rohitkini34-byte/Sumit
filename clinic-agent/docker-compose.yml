# Local dev: app + Postgres. `docker compose up --build`, then open http://localhost:8000/dev
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: clinic
      POSTGRES_PASSWORD: clinic
      POSTGRES_DB: clinic
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clinic"]
      interval: 3s
      retries: 20

  app:
    build: .
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql+asyncpg://clinic:clinic@db:5432/clinic
    ports: ["8000:8000"]
    depends_on:
      db: {condition: service_healthy}
    volumes:
      - ./secrets:/secrets:ro   # Google service-account JSON for stage 2 (read-only)

volumes:
  pgdata:
