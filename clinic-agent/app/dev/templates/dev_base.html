<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Dev tools{% endblock %}</title>
<style>
body{margin:0;font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Devanagari",sans-serif;background:#f4f5f7;color:#1d2433}
header{background:#3b2f63;color:#fff;padding:10px 16px;display:flex;gap:14px;flex-wrap:wrap;align-items:center}
header a{color:#e7defa;text-decoration:none}main{padding:16px;max-width:1100px;margin:0 auto}
.card{background:#fff;border:1px solid #e3e6ec;border-radius:10px;padding:14px;margin-bottom:14px}
button{font:inherit;border:1px solid #d7dbe3;background:#fff;border-radius:8px;padding:6px 10px;cursor:pointer}
button.primary{background:#3b2f63;color:#fff;border-color:#3b2f63}input,select,textarea{font:inherit;padding:6px 8px;border:1px solid #d7dbe3;border-radius:8px}
table{border-collapse:collapse;width:100%}td,th{padding:6px;border-bottom:1px solid #eee;text-align:left}.muted{color:#6b7385}
.clock{background:#fde68a;color:#78350f;border-radius:4px;padding:1px 6px}
</style></head><body>
<header><strong>DEV</strong><a href="/dev">Tools</a><a href="/dev/chat">WhatsApp simulator</a><a href="/dev/clock">Clock</a><a href="/dev/calendar">Fake calendar</a><a href="/dev/queue-sim">Queue simulator</a><a href="/admin">Admin</a>
<span style="flex:1"></span><span {% if clock_overridden %}class="clock"{% endif %}>Clinic time: {{ now_local }}</span></header>
<main>{% block body %}{% endblock %}</main></body></html>
