{% extends "base.html" %}
{% block body %}
<div class="card"><h2>Audit log (latest 200)</h2>
<table><tr><th>When</th><th>Actor</th><th>Action</th><th>Entity</th><th>Meta</th></tr>
{% for r in rows %}<tr><td>{{ r.ts.strftime('%Y-%m-%d %H:%M') }} UTC</td><td>{{ r.actor }}</td><td>{{ r.action }}</td><td>{{ r.entity }} {{ (r.entity_id or '')[:8] }}</td><td class="muted">{{ r.meta_json }}</td></tr>{% endfor %}
</table></div>
{% endblock %}
