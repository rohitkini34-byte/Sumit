<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>WhatsApp simulator</title>
<style>
*{box-sizing:border-box}body{margin:0;font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Devanagari",sans-serif;background:#d9dbd5;display:flex;justify-content:center}
.wrap{width:100%;max-width:480px;height:100vh;display:flex;flex-direction:column;background:#efeae2}
.top{background:#075e54;color:#fff;padding:10px 12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.top input,.top select{font:inherit;padding:4px 6px;border-radius:6px;border:0;max-width:150px}
.top a{color:#cfe;font-size:13px}
#log{flex:1;overflow-y:auto;padding:12px}
.m{max-width:85%;margin:6px 0;padding:7px 10px;border-radius:8px;white-space:pre-wrap;box-shadow:0 1px 1px rgba(0,0,0,.12);word-wrap:break-word}
.in{background:#d9fdd3;margin-left:auto}.out{background:#fff}
.tag{font-size:11px;color:#667;display:block;margin-bottom:3px}
.btns{display:flex;flex-direction:column;gap:4px;margin-top:6px}
.btns button{font:inherit;background:#fff;border:1px solid #cfd8dc;color:#027eb5;border-radius:6px;padding:6px;cursor:pointer}
.rows{margin-top:6px;border-top:1px solid #eee}
.rows button{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid #eee;padding:6px 2px;cursor:pointer;font:inherit}
.rows small{color:#667}
.bar{display:flex;gap:6px;padding:8px;background:#f0f0f0}
.bar input{flex:1;font:inherit;padding:10px;border-radius:20px;border:1px solid #ddd}
.bar button{font:inherit;border:0;background:#00a884;color:#fff;border-radius:20px;padding:0 14px;cursor:pointer}
.quick{display:flex;gap:4px;flex-wrap:wrap;padding:4px 8px;background:#f7f7f7}
.quick button{font-size:12px;border:1px solid #ccc;background:#fff;border-radius:12px;padding:2px 8px;cursor:pointer}
.used{opacity:.6}
</style></head><body>
<div class="wrap">
  <div class="top">
    <select id="phone"><option>+919800000001</option><option>+919800000002</option><option>+919800000003</option><option>+919800000004</option></select>
    <input id="custom" placeholder="or +91…" size="12">
    <input id="name" value="Asha Patil" size="10">
    <a href="/dev">dev tools</a><a href="/admin/queue" target="_blank">queue</a>
    <span style="font-size:12px;opacity:.8">{{ now_local }}</span>
  </div>
  <div class="quick">
    <button data-t="Hi">Hi</button><button data-t="Kal subah appointment chahiye">Kal subah…</button>
    <button data-t="उद्या संध्याकाळी वेळ मिळेल का?">उद्या संध्याकाळी…</button><button data-t="Can I come next Monday after 6?">next Monday after 6</button>
    <button data-t="When is my turn?">my turn?</button><button data-t="I want to cancel my appointment">cancel</button>
    <button data-t="what medicine for fever?">medicine?</button><button data-t="chest pain since 20 min">emergency</button>
    <button data-t="STOP">STOP</button><button id="img">send image</button><button id="clear">clear</button>
  </div>
  <div id="log"></div>
  <form class="bar" id="f"><input id="text" autocomplete="off" placeholder="Type a message"><button>Send</button></form>
</div>
<script>
const SECRET = {{ app_secret|tojson }};
const log = document.getElementById('log');
const local = {};  // phone -> [{dir:'in', text, ts}]
let seen = {};     // outbound ids rendered
function phone(){ const c=document.getElementById('custom').value.trim(); return c || document.getElementById('phone').value; }
function nowTs(){ return Math.floor(Date.now()/1000).toString(); }
function uid(){ return 'wamid.sim.'+Math.random().toString(16).slice(2)+Date.now().toString(16); }

async function sign(body){
  if (window.crypto && crypto.subtle){
    const enc=new TextEncoder();
    const key=await crypto.subtle.importKey('raw', enc.encode(SECRET), {name:'HMAC',hash:'SHA-256'}, false, ['sign']);
    const sig=await crypto.subtle.sign('HMAC', key, enc.encode(body));
    return 'sha256='+[...new Uint8Array(sig)].map(b=>b.toString(16).padStart(2,'0')).join('');
  }
  const r=await fetch('/dev/api/sign',{method:'POST',body}); return (await r.json()).signature;
}

function payload(msg){
  const wa=phone().replace('+','');
  return {object:'whatsapp_business_account',entry:[{id:'WABA_DEV',changes:[{field:'messages',value:{
    messaging_product:'whatsapp',metadata:{display_phone_number:'15550000000',phone_number_id:'PNID_DEV'},
    contacts:[{profile:{name:document.getElementById('name').value},wa_id:wa}],
    messages:[Object.assign({from:wa,id:uid(),timestamp:nowTs()},msg)]}}]}]};
}

async function post(msg, shown){
  (local[phone()] ||= []).push({dir:'in', text:shown, t:Date.now()});
  render();
  const body=JSON.stringify(payload(msg));
  const r=await fetch('/webhook/whatsapp',{method:'POST',headers:{'Content-Type':'application/json','X-Hub-Signature-256':await sign(body)},body});
  if(!r.ok){ (local[phone()] ||= []).push({dir:'sys', text:'webhook returned '+r.status, t:Date.now()}); render(); }
  setTimeout(poll, 300); setTimeout(poll, 1200);
}
function sendText(t){ if(t) post({type:'text',text:{body:t}}, t); }
function tapButton(id,title,isTemplate){
  if(isTemplate) post({type:'button',button:{payload:id,text:title}}, '▸ '+title);
  else post({type:'interactive',interactive:{type:'button_reply',button_reply:{id,title}}}, '▸ '+title);
}
function tapRow(id,title){ post({type:'interactive',interactive:{type:'list_reply',list_reply:{id,title}}}, '▸ '+title); }

let outbound=[];
async function poll(){
  const r=await fetch('/dev/api/messages?phone='+encodeURIComponent(phone())); const j=await r.json();
  if(JSON.stringify(j.messages.map(m=>m.id))!==JSON.stringify(outbound.map(m=>m.id))){ outbound=j.messages; render(true); }
}
function el(tag,cls,text){const e=document.createElement(tag); if(cls)e.className=cls; if(text!==undefined)e.textContent=text; return e;}
function render(scroll=true){
  const items=[...(local[phone()]||[]).map(m=>({...m, ts:m.t})), ...outbound.map(m=>({dir:'out', m, ts:Date.parse(m.ts)}))];
  items.sort((a,b)=>a.ts-b.ts);
  log.innerHTML='';
  for(const it of items){
    if(it.dir!=='out'){ const d=el('div','m '+(it.dir==='in'?'in':'out'),it.text); log.appendChild(d); continue; }
    const m=it.m, d=el('div','m out');
    if(m.kind==='template') d.appendChild(el('span','tag','template: '+m.template));
    d.appendChild(document.createTextNode(m.text));
    if(m.buttons && m.buttons.length){ const b=el('div','btns'); for(const [id,title] of m.buttons){ const x=el('button','',title); x.onclick=()=>tapButton(id,title,m.kind==='template'); b.appendChild(x);} d.appendChild(b); }
    if(m.rows && m.rows.length){ const b=el('div','rows'); for(const [id,title,desc] of m.rows){ const x=el('button'); x.appendChild(el('div','',title)); if(desc) x.appendChild(el('small','',desc)); x.onclick=()=>tapRow(id,title); b.appendChild(x);} d.appendChild(b); }
    log.appendChild(d);
  }
  if(scroll) log.scrollTop=log.scrollHeight;
}
document.getElementById('f').onsubmit=e=>{e.preventDefault(); const i=document.getElementById('text'); sendText(i.value.trim()); i.value='';};
document.querySelectorAll('.quick button[data-t]').forEach(b=>b.onclick=()=>sendText(b.dataset.t));
document.getElementById('img').onclick=()=>post({type:'image',image:{id:'img1',mime_type:'image/jpeg'}}, '[image]');
document.getElementById('clear').onclick=async()=>{ await fetch('/dev/api/reset?phone='+encodeURIComponent(phone()),{method:'POST'}); local[phone()]=[]; outbound=[]; render(); };
document.getElementById('phone').onchange=()=>{outbound=[]; poll(); render();};
setInterval(poll, 1500); poll();
</script></body></html>
